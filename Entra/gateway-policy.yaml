  Goals.Read:           [searchGoals, getGoal, getGoalUpdate, getGoalTypes]                       # read:goals:agent-interface
  Goals.Write:          [createGoal, createGoalUpdate, addConnectionsToGoals]                     # write:goals:agent-interface
  Projects.Read:        [searchProjects, getProject, getProjectUpdate]                            # read:projects:agent-interface
  Projects.Write:       [createProject, createProjectUpdate, addConnectionsToProjects]            # write:projects:agent-interface
  Teams.Read:           [searchTeams, getTeam]                                                    # read:teams:agent-interface   (OAuth only)
  Teams.Write:          [createTeam, updateTeam]                                                  # write:teams:agent-interface  (OAuth only)
  Focus.Read:           [searchFocusAreas, getFocusArea, getFocusAreaTypes, getFocusAreaCustomFields]  # read:focus:agent-interface
  Focus.Write:          [createFocusArea, updateFocusArea, createFocusAreaStatusUpdate, linkToFocusArea] # write:focus:agent-interface
