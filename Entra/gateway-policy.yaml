  Talent.Write:         [createTalentSkill, updateTalentWorkerSkillMappings, updateTalentPositionFocusAreaMappings] # write:talent:agent-interface
  CapacityPlanning.Read:  [getCapacityPlanAllocations, searchCapacityPlanNonProjectWork]          # read:capacity-planning:agent-interface
  CapacityPlanning.Write: [updateCapacityPlanAllocation, createCapacityPlanNonProjectWork, updateCapacityPlanNonProjectWork] # write:capacity-planning:agent-interface
  JiraAlign.Read:       [getJiraAlignTerminology, describeJiraAlignItemType, getJiraAlignItem, listJiraAlignItems] # read:jira-align:agent-interface (OAuth only)
