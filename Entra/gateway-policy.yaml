# Atlassian MCP Gateway - capability policy (POC)
# Source: support.atlassian.com/atlassian-ai-gateway/docs/supported-tools/ (read 2026-11-18)
# Entra app role (gateway) == one Atlassian MCP permission group == one Atlassian OAuth scope.
# Tool names are verbatim (case-sensitive). Unlisted tools are DENIED.
#
# IMPORTANT (v2): the default endpoint exposes Primary tools + meta-tools
#   discover / executeRead / executeWrite / executeDestructive.
# The broker must either
#   (a) connect upstream with https://mcp.atlassian.com/v2/mcp?tools=all (flat list) and hide the meta-tools, or
#   (b) inspect the inner tool name inside execute* arguments and apply the same policy.
# (a) is simpler and recommended for the POC.

entra:
  audience: <gwAppId>
  allowedBlueprints: [ed3dafa1-ffe5-4a14-a63a-8176cb3e86de]

upstream:
  url: https://mcp.atlassian.com/v2/mcp?tools=all
  hideTools: [discover, executeRead, executeWrite, executeDestructive]

# Delegated scope (scp, inherited via blueprint) -> which app roles it may unlock in OBO
delegatedScopeGate:
  Atlassian.Read:   [Jira.Read, Jira.Search, Confluence.Read, Confluence.Search, Jsm.Read, Bitbucket.Read,
                     TeamworkGraph.Read, Rovo.Search, Code.Search, Assets.Read, Loom.Read, Goals.Read,
                     Projects.Read, Teams.Read, Focus.Read, Talent.Read, CapacityPlanning.Read,
                     JiraAlign.Read, Insights.Read]
  Atlassian.Write:  [Jira.Write, Confluence.Write, Jsm.Write, Bitbucket.Write, TeamworkGraph.Write, Loom.Write,
                     Goals.Write, Projects.Write, Teams.Write, Focus.Write, Talent.Write,
                     CapacityPlanning.Write, JiraAlign.Write]
  Atlassian.Delete: [Jira.Delete, Jira.Manage]

# Always allowed for any authenticated caller (no data access on their own)
common: [atlassianUserInfo, getAccessibleAtlassianResources, getContentFormatGuide]

