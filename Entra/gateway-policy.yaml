# Backend credential selection (autonomous). Each Atlassian service-account key must carry
# the matching *:agent-interface scopes. Roles marked OAuth-only can never be served app-only.
backend:
  appOnly:
    - roles: [Jira.Read, Jira.Search, Confluence.Read, Confluence.Search, Rovo.Search]
      secret: kv://atl-svc-read
    - roles: [Jira.Write, Confluence.Write]
      secret: kv://atl-svc-write
  onBehalfOf:
    tokenStore: kv-or-db             # Atlassian refresh token per (tid, userOid, agentAppId)
    requestScopes: derived           # union of atlassianScope for the caller's effective roles + offline_access read:me
